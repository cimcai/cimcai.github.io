# Managed by cimcai/website-main. Edit the source template, not this deployed copy.
name: Build published articles
run-name: "Build published articles — ${{ inputs.publication_event_id || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      publication_event_id:
        description: Publication delivery UUID (blank for manual recovery)
        required: false
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: publication-artifacts-main
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.repository == 'cimcai/cimcai.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate publication event
        env:
          PUBLICATION_EVENT_ID: ${{ inputs.publication_event_id }}
        run: node --input-type=module -e 'import {validatePublicationEventId} from "./.github/scripts/verify-publication-pdfs.mjs"; validatePublicationEventId(process.env.PUBLICATION_EVENT_ID || "")'
      - name: Sync current public snapshots
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            test "$(cat CNAME)" = "cimc.ai"
            base="$(git rev-parse HEAD)"
            node .github/scripts/sync-publication-pdfs.mjs \
              --target . --config .github/publication-pdf-sync.json
            node .github/scripts/build-static-publications.mjs \
              --target . --config .github/publication-pdf-sync.json
            git add -- publications pub writing
            if git diff --cached --quiet; then
              break
            fi
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Build published articles'
            if git push origin HEAD:main; then
              break
            fi
            # A source deployment may have advanced main. Recompute on its files;
            # never force-push or replay stale PDFs over a newer website build.
            git fetch --depth=1 origin main
            test "$(git rev-parse origin/main)" != "$base"
            test "$attempt" -lt 3
            git reset --hard origin/main
          done
      - name: Request Pages build when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not themselves trigger branch-based Pages.
          # Also recover a prior push whose subsequent build request failed.
          latest="$(gh api 'repos/cimcai/cimcai.github.io/pages/builds/latest')"
          head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$(jq -r .commit <<<"$latest")" != "$head" ]] || \
             [[ "$(jq -r .status <<<"$latest")" == "errored" ]]; then
            gh api --method POST 'repos/cimcai/cimcai.github.io/pages/builds' --silent
          fi
      - name: Verify Pages build and served publication manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_EVENT_ID: ${{ inputs.publication_event_id }}
          PDF_DEPLOY_REPOSITORY: cimcai/cimcai.github.io
          PDF_DEPLOY_SITE_ORIGIN: https://cimc.ai
        run: |
          set -euo pipefail
          export PDF_DEPLOY_COMMIT="$(git rev-parse HEAD)"
          node .github/scripts/verify-publication-pdfs.mjs
          node .github/scripts/verify-static-publications.mjs
